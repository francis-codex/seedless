<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>seedless — wallet and cash-out, one thing</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1280px; height: 720px; background: #ffffff;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    overflow: hidden; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .frame { width: 1280px; height: 720px; padding: 66px 92px; display: flex; align-items: center; gap: 48px; position: relative; }

  .frame::after { content: ""; position: absolute; right: 150px; top: 50%; transform: translateY(-50%); width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(0,178,255,0.16), rgba(0,178,255,0) 68%); z-index: 0; }

  /* LEFT — minimal, bold */
  .left { width: 440px; flex-shrink: 0; display: flex; flex-direction: column; height: 100%; position: relative; z-index: 1; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 64px; height: 64px; border-radius: 16px; display: block; }
  .brand span { font-size: 44px; font-weight: 800; color: #0b0b0f; letter-spacing: -0.02em; }
  .midwrap { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font-size: 25px; font-weight: 800; color: #00B2FF; letter-spacing: 0.07em; margin-bottom: 22px; }
  .kicker { font-size: 60px; font-weight: 800; color: #0b0b0f; letter-spacing: -0.04em; line-height: 1.0; }
  .kicker .accent { color: #00B2FF; }

  /* RIGHT — dark phone mockup */
  .right { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; z-index: 1; }
  .phone { width: 322px; height: 588px; background: #050506; border-radius: 52px; padding: 13px; box-shadow: 0 50px 90px -30px rgba(11,11,15,0.55), 0 12px 34px -14px rgba(0,178,255,0.34); }
  .screen { width: 100%; height: 100%; background: #0b0c10; border-radius: 40px; padding: 30px 26px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .screen::before { content: ""; position: absolute; top: -120px; left: 50%; transform: translateX(-50%); width: 300px; height: 240px; background: radial-gradient(circle, rgba(0,178,255,0.22), rgba(0,178,255,0) 70%); }
  .notch { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); width: 96px; height: 9px; border-radius: 999px; background: #ffffff; opacity: 0.16; }

  .shead { display: flex; align-items: center; gap: 11px; margin-top: 22px; margin-bottom: 32px; position: relative; }
  .shead img { width: 34px; height: 34px; border-radius: 10px; }
  .shead span { font-size: 22px; font-weight: 800; color: #ffffff; letter-spacing: -0.02em; }

  .tile { background: #17191f; border: 1px solid #23262e; border-radius: 22px; padding: 24px 22px; display: flex; align-items: center; gap: 16px; position: relative; }
  .tico { width: 52px; height: 52px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 27px; font-weight: 800; flex-shrink: 0; }
  .tico.crypto { background: linear-gradient(135deg, #33c6ff, #00B2FF); color: #fff; }
  .tico.fiat { background: #ffffff; color: #0b0b0f; }
  .tval { font-size: 28px; font-weight: 800; color: #ffffff; letter-spacing: -0.02em; white-space: nowrap; }

  .arrow { display: flex; justify-content: center; align-items: center; height: 48px; position: relative; }
  .arrow .a { width: 44px; height: 44px; border-radius: 50%; background: rgba(0,178,255,0.16); color: #00B2FF; display: flex; align-items: center; justify-content: center; font-size: 23px; font-weight: 800; }

  .cta { margin-top: auto; background: #00B2FF; color: #fff; text-align: center; font-size: 21px; font-weight: 800; padding: 20px; border-radius: 18px; box-shadow: 0 18px 34px -12px rgba(0,178,255,0.7); position: relative; }
</style>
</head>
<body>
  <div class="frame">
    <div class="left">
      <div class="brand">
        <img src="seedless-icon.png" alt="" />
        <span>seedless</span>
      </div>
      <div class="midwrap">
        <div class="eyebrow">MONEY IN CRYPTO · LIFE IN FIAT</div>
        <div class="kicker">one wallet.<br/><span class="accent">both sides.</span></div>
      </div>
    </div>

    <div class="right">
      <div class="phone">
        <div class="screen">
          <div class="notch"></div>
          <div class="shead">
            <img src="seedless-icon.png" alt="" />
            <span>Seedless</span>
          </div>

          <div class="tile">
            <div class="tico crypto">$</div>
            <div class="tval">1,000 USDC</div>
          </div>

          <div class="arrow"><div class="a">↓</div></div>

          <div class="tile">
            <div class="tico fiat">₦</div>
            <div class="tval">₦1,500,000</div>
          </div>

          <div class="cta">Cash out</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
