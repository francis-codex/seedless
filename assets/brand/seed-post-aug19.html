<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>$SEED token</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1280px;
    height: 720px;
    background: #0a0a0a;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .frame {
    width: 1280px;
    height: 720px;
    display: flex;
    align-items: center;
    padding: 0 80px;
    gap: 60px;
  }

  .left {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 28px;
  }

  .seedless-logo {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    overflow: hidden;
  }

  .seedless-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .headline {
    font-size: 72px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: -0.04em;
    line-height: 1;
    white-space: nowrap;
  }

  .accent {
    color: #00B2FF;
  }

  .right {
    flex: 1;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    height: 100%;
  }

  .screenshot {
    height: 680px;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 32px 80px rgba(0,178,255,0.12);
    border: 1px solid rgba(255,255,255,0.08);
  }

  .screenshot img {
    height: 100%;
    width: auto;
    display: block;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="left">
      <div class="seedless-logo"><img src="seedless-icon.png" alt="seedless" /></div>
      <div class="headline">we have a <span class="accent">token</span></div>
    </div>
    <div class="right">
      <div class="screenshot"><img src="seed-bags-screenshot.png" alt="$SEED on bags" /></div>
    </div>
  </div>
</body>
</html>
