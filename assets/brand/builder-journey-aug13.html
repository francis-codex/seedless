<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>builder journey — august 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1280px;
    height: 720px;
    background: #ffffff;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .frame {
    width: 1280px;
    height: 720px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 58px 80px;
  }

  .top-mark {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 30px;
  }

  .seedless-logo {
    width: 72px;
    height: 72px;
    border-radius: 19px;
    overflow: hidden;
    box-shadow: 0 16px 40px rgba(0,0,0,0.12);
  }

  .seedless-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .brand {
    font-size: 32px;
    font-weight: 800;
    color: #0a0a0a;
    letter-spacing: -0.02em;
  }

  .headline {
    font-size: 128px;
    font-weight: 900;
    color: #0a0a0a;
    letter-spacing: -0.05em;
    line-height: 0.9;
    text-align: center;
  }

  .date {
    margin-top: 20px;
    font-size: 28px;
    font-weight: 700;
    color: #6b6b6b;
    letter-spacing: -0.01em;
  }

  .stats {
    margin-top: 52px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 40px 78px;
    width: 100%;
    max-width: 940px;
  }

  .stat { text-align: center; }

  .stat-n {
    font-size: 62px;
    font-weight: 900;
    color: #00B2FF;
    letter-spacing: -0.04em;
    line-height: 1;
  }

  .stat-l {
    margin-top: 9px;
    font-size: 19px;
    font-weight: 700;
    color: #6b6b6b;
    letter-spacing: 0.01em;
  }

  .pill {
    margin-top: 52px;
    display: inline-flex;
    align-items: center;
    padding: 16px 34px;
    border-radius: 999px;
    background: #00B2FF;
    box-shadow: 0 16px 40px rgba(0,178,255,0.28);
  }

  .pill-label {
    font-size: 24px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="top-mark">
      <div class="seedless-logo"><img src="seedless-icon.png" alt="seedless" /></div>
      <div class="brand">seedless</div>
    </div>

    <div class="headline">eight months</div>
    <div class="date">25 december 2025 &rarr; 13 august 2026</div>

    <div class="stats">
      <div class="stat"><div class="stat-n">190</div><div class="stat-l">tests, from zero</div></div>
      <div class="stat"><div class="stat-n">4</div><div class="stat-l">hackathon results</div></div>
      <div class="stat"><div class="stat-n">25</div><div class="stat-l">testers paid on chain</div></div>
      <div class="stat"><div class="stat-n">150+</div><div class="stat-l">on the waitlist</div></div>
      <div class="stat"><div class="stat-n">92</div><div class="stat-l">commits since june</div></div>
      <div class="stat"><div class="stat-n">0</div><div class="stat-l">spent on acquisition</div></div>
    </div>

    <div class="pill"><span class="pill-label">launching september</span></div>
  </div>
</body>
</html>
