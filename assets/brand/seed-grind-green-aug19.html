<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>$SEED 9:25 pm</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1146px;
    height: 1280px;
    overflow: hidden;
  }

  .frame {
    width: 1146px;
    height: 1280px;
    position: relative;
  }

  .screenshot {
    width: 100%;
    height: 100%;
    display: block;
  }

  .stamp {
    position: absolute;
    bottom: 24px;
    right: 24px;
    transform: rotate(-6deg);
    font-family: Impact, 'Arial Black', sans-serif;
    font-size: 48px;
    font-weight: 900;
    color: #ffffff;
    text-transform: uppercase;
    padding: 12px 24px;
    border: 5px solid #ffffff;
    background: rgba(0,0,0,0.8);
    text-shadow: 0 2px 8px rgba(0,0,0,1);
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
  <div class="frame">
    <img class="screenshot" src="seed-green-aug19.jpg" alt="$SEED" />
    <div class="stamp">9:25 PM  $66K</div>
  </div>
</body>
</html>
